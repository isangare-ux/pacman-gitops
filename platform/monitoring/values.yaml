grafana:
  enabled: true

prometheus:
  enabled: true

alertmanager:
  enabled: true

# Docker-Desktop-Anpassung:
# Der Standard-mountPropagation "HostToContainer" fuer den /host/root-Mount
# verlangt einen shared/slave Host-Mount. Docker Desktop stellt das nicht
# bereit -> Container startet nicht (ContainerCannotRun, Exit Code 128,
# "path / is mounted on / but it is not a shared or slave mount").
# Mount bleibt aktiv (node_filesystem_* Metriken bleiben erhalten), nur
# die Propagation wird entfernt.
prometheus-node-exporter:
  hostRootFsMount:
    enabled: true
    mountPropagation: ""

# DevOps-Fall D15 (Testfall, absichtlich): kontrolliert falscher
# kube-state-metrics-Selector nur fuer den Monitoring-Testbereich.
#
# Hintergrund: Standardisierung der Monitoring-Labels/-Selektoren. Pacman
# hat keinen eigenen ServiceMonitor/PodMonitor (kein /metrics-Endpoint) -
# die Sichtbarkeit laeuft ausschliesslich ueber kube-state-metrics
# (cluster-weiter Job) + PromQL-Filter auf "namespace". Der reale,
# unterstuetzte Selector-Mechanismus dafuer ist der Namespace-Denylist
# von kube-state-metrics (--namespaces-denylist). Mit "pacman-dev" hier
# wird gezielt nur der Dev-Namespace aus der Objekterfassung ausgeschlossen:
# Prometheus/kube-state-metrics bleiben "up", aber alle kube_*-Metriken
# (Pods, Deployment-Status, Container-Restarts) fuer pacman-dev
# verschwinden - waehrend Pacman selbst und pacman-prod unveraendert
# weiterlaufen.
kube-state-metrics:
  namespacesDenylist: "pacman-dev"
