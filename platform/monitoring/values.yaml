grafana:
  enabled: true

prometheus:
  enabled: true

alertmanager:
  enabled: true

# Docker-Desktop-Anpassung:
# Der Standard-mountPropagation "HostToContainer" fuer den /host/root-Mount
# verlangt einen shared/slave Host-Mount. Docker Desktop stellt das nicht
# bereit -> Container startet nicht (ContainerCannotRun, Exit Code 128,
# "path / is mounted on / but it is not a shared or slave mount").
# Mount bleibt aktiv (node_filesystem_* Metriken bleiben erhalten), nur
# die Propagation wird entfernt.
prometheus-node-exporter:
  hostRootFsMount:
    enabled: true
    mountPropagation: ""
