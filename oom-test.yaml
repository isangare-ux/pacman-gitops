apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: pacman-dev
  labels:
    test: ap19-oom
spec:
  containers:
  - name: stress
    image: polinux/stress
    resources:
      requests:
        memory: "32Mi"
        cpu: "100m"
      limits:
        memory: "64Mi"
        cpu: "200m"
    command:
      - stress
      - "--vm"
      - "1"
      - "--vm-bytes"
      - "128M"
      - "--vm-hang"
      - "1"
