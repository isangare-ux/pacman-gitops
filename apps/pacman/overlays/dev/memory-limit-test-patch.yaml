# DevOps-Fall D14 (Testfall, absichtlich): kontrolliert zu niedriges
# Memory-Limit fuer Pacman, ausschliesslich in pacman-dev.
#
# Hintergrund: Referenzumgebung soll auf ressourcenbegrenzten
# Schulungsrechnern laufen - dieser Test zeigt, warum eine Reduzierung
# der Memory-Limits vor dem produktiven Einsatz unter Last geprueft
# werden muss. 64Mi ist das per LimitRange (pacman-container-limits)
# erlaubte Minimum und liegt bereits unterhalb der beobachteten
# Idle-Nutzung von ca. 48Mi - unter Last ist ein OOMKilled zu erwarten.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman
spec:
  template:
    spec:
      containers:
        - name: pacman
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
