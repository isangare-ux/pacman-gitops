# Overlay für die Dev-Umgebung.
#
# Ein Overlay verändert NICHT die base selbst, sondern nimmt sie als
# Grundlage und wendet zusätzliche Anpassungen an, die nur für diese eine
# Umgebung gelten. Dadurch bleibt die base wiederverwendbar für dev UND
# prod, ohne dass Konfiguration doppelt gepflegt werden muss.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Alle Ressourcen aus der base werden in diesen Namespace deployt,
# statt in "default". Trennt dev vollständig von prod im Cluster.
namespace: pacman-dev

# Verweist auf die base-Kustomization statt einzelne Dateien erneut
# aufzulisten — die eigentlichen Kubernetes-Manifeste kommen von dort.
resources:
- namespace.yaml
- ../../base

# Zusätzliches Label, das über commonLabels aus der base hinaus gesetzt
# wird. Damit lassen sich dev-Ressourcen im Cluster klar von prod
# unterscheiden (z. B. "kubectl get all -l environment=dev").

labels:
- pairs:
    app.kubernetes.io/instance: pacman-dev
    environment: dev

replicas:
- count: 1
  name: pacman

# Umgebungsspezifische Anpassung des Ingress-Hostnamens.
# Die Base verwendet pacman.local für Produktion.
# Im Dev-Overlay wird dieser Wert auf pacman-dev.local geändert.
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: pacman-dev.local
  target:
    kind: Ingress
    name: pacman
- path: hpa-dev-patch.yaml
images:
- name: ghcr.io/isangare-ux/pacman-app
  newName: ghcr.io/isangare-ux/pacman-app
  newTag: 6f6a378f0d0dee3ced6f6fb57a9131f725b72dac
