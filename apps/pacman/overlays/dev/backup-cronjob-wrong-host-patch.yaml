# DevOps-Fall D09: bewusst falscher MongoDB-Service-Hostname im
# Backup-CronJob, um einen fehlschlagenden Backup-Job zu provozieren.
#
# Ausgangswert (fuer Reset): MONGO_HOST=mongodb
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: mongodb-backup
              env:
                - name: MONGO_HOST
                  value: mongodb-wrong-host
