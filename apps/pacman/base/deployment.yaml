apiVersion: apps/v1
kind: Deployment

metadata:
  name: pacman
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: pacman-platform
    app.kubernetes.io/managed-by: argocd
    responsibility: devops

spec:
  # Neutraler Basiswert.
  # Dev und Prod überschreiben diesen Wert über ihre Overlays.
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: pacman

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Während eines Updates darf ein zusätzlicher Pod erstellt werden.
      maxSurge: 1

      # Ein vorhandener Pod wird erst beendet,
      # wenn der neue Pod verfügbar ist.
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: pacman-platform
        app.kubernetes.io/managed-by: argocd
        responsibility: devops

    spec:
      # Eigene Kubernetes-Identität der Anwendung.
      serviceAccountName: pacman

      # Zeit für ein kontrolliertes Herunterfahren des Containers.
      terminationGracePeriodSeconds: 30

      # Pod-weiter SecurityContext: gilt für alle Container im Pod.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: pacman

          # GHCR-Image mit unveränderlichem Commit-SHA-Tag.
          image: ghcr.io/isangare-ux/pacman-app:dfe16c3c188e5011a8fa91324524fb63aaf91a91

          # Bei einem unveränderlichen Commit-SHA-Tag ist IfNotPresent
          # nachvollziehbar und vermeidet unnötige Downloads.
          imagePullPolicy: IfNotPresent

          # Container-spezifischer SecurityContext.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
              httpGet:
                path: /highscores/list
                port: http
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 3
              successThreshold: 1

          # MongoDB-Verbindungsdaten aus der ConfigMap "pacman-config" statt
          # fest verdrahtet — Anpassungen erfordern keine Änderung an dieser
          # Datei, nur ein Update der ConfigMap.
          env:
            - name: MONGO_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: pacman-config
                  key: MONGO_SERVICE_HOST

            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: pacman-config
                  key: MONGO_DATABASE

            - name: MY_MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: pacman-config
                  key: MY_MONGO_PORT