# Vorlage für das Secret "mongodb-credentials".
#
# Diese Datei enthält AUSSCHLIESSLICH Platzhalterwerte und wird bewusst
# NICHT in apps/pacman/base/kustomization.yaml als resource eingebunden —
# Secrets sind kein Teil des versionierten GitOps-Resource-Sets. Sie
# dient nur als Referenz für Struktur und Key-Namen.
#
# Die echten Werte werden lokal je Umgebung/Namespace über
# scripts/create-local-secrets.sh erzeugt und direkt in den Cluster
# angewendet — niemals über Git committet.
#
# Key-Namen müssen exakt zu den secretKeyRef-Verweisen in
# mongodb-statefulset.yaml passen: root-username, root-password,
# app-username, app-password.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: pacman-platform
    app.kubernetes.io/managed-by: argocd
    responsibility: devops
type: Opaque
stringData:
  # Admin-Zugang für MongoDB selbst (MONGO_INITDB_ROOT_*).
  root-username: "CHANGE_ME_ROOT_USERNAME"
  root-password: "CHANGE_ME_ROOT_PASSWORD"

  # Anwendungsbenutzer mit readWrite auf der Datenbank "pacman",
  # angelegt über apps/pacman/base/mongodb-init-configmap.yaml.
  # Diese Werte entsprechen MONGO_AUTH_USER/MONGO_AUTH_PWD, die die
  # Pacman-Anwendung selbst zur Verbindung mit MongoDB nutzt.
  app-username: "CHANGE_ME_APP_USERNAME"
  app-password: "CHANGE_ME_APP_PASSWORD"
