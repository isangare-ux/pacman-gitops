apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: backup

spec:
  schedule: "0 15 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        metadata:
          labels:
            app.kubernetes.io/name: mongodb
            app.kubernetes.io/component: backup

        spec:
          restartPolicy: OnFailure

          containers:
            - name: mongodb-backup
              image: mongo:4.4.30-focal

              env:
                - name: MONGO_HOST
                  value: mongodb

                - name: MONGO_DATABASE
                  value: pacman

                - name: MONGO_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-credentials
                      key: app-username

                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-credentials
                      key: app-password

              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
                  BACKUP_FILE="/backup/pacman-${TIMESTAMP}.archive.gz"

                  echo "Starte MongoDB-Backup: ${BACKUP_FILE}"

                  mongodump \
                    --host="${MONGO_HOST}" \
                    --port=27017 \
                    --username="${MONGO_USERNAME}" \
                    --password="${MONGO_PASSWORD}" \
                    --authenticationDatabase="${MONGO_DATABASE}" \
                    --db="${MONGO_DATABASE}" \
                    --archive="${BACKUP_FILE}" \
                    --gzip

                  sha256sum "${BACKUP_FILE}" > "${BACKUP_FILE}.sha256"

                  find /backup \
                    -type f \
                    \( -name 'pacman-*.archive.gz' -o -name 'pacman-*.archive.gz.sha256' \) \
                    -mtime +7 \
                    -delete

                  echo "Backup erfolgreich erstellt: ${BACKUP_FILE}"

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

              volumeMounts:
                - name: backup-storage
                  mountPath: /backup

          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mongodb-backup
